name: Build and test

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

env:
  DOTNET_VERSION: 10.0.x
  BUILD_CONFIGURATION: Release
  SOLUTION_PATH: MoopelBackend.slnx
  TEST_PROJECT_PATH: ApiTests/ApiTests.csproj
  TEST_RESULTS_DIRECTORY: test-results
  UNIT_TEST_FILTER: FullyQualifiedName~ApiTests.Unit
  INTEGRATION_TEST_FILTER: FullyQualifiedName~ApiTests.Integration

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run unit tests
        run: >
          dotnet test ${{ env.TEST_PROJECT_PATH }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --filter "${{ env.UNIT_TEST_FILTER }}"
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory "${{ env.TEST_RESULTS_DIRECTORY }}"

      - name: Run integration tests
        run: >
          dotnet test ${{ env.TEST_PROJECT_PATH }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --filter "${{ env.INTEGRATION_TEST_FILTER }}"
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory "${{ env.TEST_RESULTS_DIRECTORY }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.TEST_RESULTS_DIRECTORY }}/*.trx
          if-no-files-found: error
