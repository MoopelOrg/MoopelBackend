name: Build image

on:
  workflow_run:
    workflows:
      - Build and test
    types:
      - completed

env:
  IMAGE_NAME: ghcr.io/moopelorg/moopelbackend
  IMAGE_ARCHIVE_NAME: moopelbackend.tar
  SOURCE_DIRECTORY: source
  DEFAULT_BRANCH: main

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch source
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          git init "${SOURCE_DIRECTORY}"
          cd "${SOURCE_DIRECTORY}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
          git fetch --force --tags origin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate image tags
        id: tags
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        working-directory: ${{ env.SOURCE_DIRECTORY }}
        run: |
          set -euo pipefail
          mapfile -t release_tags < <(git tag --points-at "${HEAD_SHA}" | grep -E '^v[0-9]+' || true)

          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${HEAD_SHA}"

            if [[ "${HEAD_BRANCH}" == "${DEFAULT_BRANCH}" ]]; then
              echo "${IMAGE_NAME}:latest"
            fi

            for release_tag in "${release_tags[@]}"; do
              echo "${IMAGE_NAME}:${release_tag}"
            done

            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SOURCE_DIRECTORY }}
          file: ${{ env.SOURCE_DIRECTORY }}/MoopelApi/Dockerfile
          load: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Save deployment image archive
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: docker save --output "${{ env.IMAGE_ARCHIVE_NAME }}" "${IMAGE_NAME}:${HEAD_SHA}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tags
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            docker push "${tag}"
          done <<< "${{ steps.tags.outputs.tags }}"

      - name: Summarize published image tags
        run: |
          {
            echo "### Published image tags"
            echo
            while IFS= read -r tag; do
              [[ -n "${tag}" ]] && echo "- ${tag}"
            done <<< "${{ steps.tags.outputs.tags }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload deployment image archive
        uses: actions/upload-artifact@v4
        with:
          name: moopelbackend-docker-${{ github.event.workflow_run.head_sha }}
          path: ${{ env.IMAGE_ARCHIVE_NAME }}
          if-no-files-found: error
