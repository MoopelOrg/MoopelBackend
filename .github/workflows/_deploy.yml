name: Reusable deploy

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      container_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      run_smoke_tests:
        required: false
        type: boolean
        default: false

env:
  IMAGE_NAME: ghcr.io/moopelorg/moopelbackend
  DEFAULT_CONTAINER_PORT: '8080'
  DEFAULT_DEPLOY_PORT: '22'
  DEFAULT_HEALTHCHECK_RETRIES: '12'
  DEFAULT_HEALTHCHECK_DELAY_SECONDS: '10'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    concurrency:
      group: deploy-${{ inputs.environment_name }}
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail

          missing=0
          for variable_name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS GHCR_USERNAME GHCR_READ_TOKEN; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing required environment secret: ${variable_name}"
              missing=1
            fi
          done

          exit "${missing}"

      - name: Prepare SSH configuration
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/id_ed25519" "${HOME}/.ssh/known_hosts"

      - name: Deploy container image
        env:
          CONTAINER_ENV_FILE_PATH: ${{ vars.CONTAINER_ENV_FILE_PATH }}
          CONTAINER_NAME: ${{ inputs.container_name }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT_VALUE: ${{ vars.DEPLOY_PORT }}
          DEPLOY_RUN_ARGS: ${{ vars.DOCKER_RUN_ARGS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          HEALTHCHECK_DELAY_SECONDS: ${{ vars.HEALTHCHECK_DELAY_SECONDS }}
          HEALTHCHECK_RETRIES: ${{ vars.HEALTHCHECK_RETRIES }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          deploy_port="${DEPLOY_PORT_VALUE:-${DEFAULT_DEPLOY_PORT}}"
          remote_command=$(
            cat <<EOF
          IMAGE_NAME=$(printf '%q' "${IMAGE_NAME}") \
          IMAGE_TAG=$(printf '%q' "${IMAGE_TAG}") \
          CONTAINER_NAME=$(printf '%q' "${CONTAINER_NAME}") \
          ENVIRONMENT_NAME=$(printf '%q' "${ENVIRONMENT_NAME}") \
          GHCR_USERNAME=$(printf '%q' "${GHCR_USERNAME}") \
          GHCR_READ_TOKEN=$(printf '%q' "${GHCR_READ_TOKEN}") \
          CONTAINER_ENV_FILE_PATH=$(printf '%q' "${CONTAINER_ENV_FILE_PATH}") \
          DEPLOY_RUN_ARGS=$(printf '%q' "${DEPLOY_RUN_ARGS}") \
          HEALTHCHECK_RETRIES=$(printf '%q' "${HEALTHCHECK_RETRIES:-${DEFAULT_HEALTHCHECK_RETRIES}}") \
          HEALTHCHECK_DELAY_SECONDS=$(printf '%q' "${HEALTHCHECK_DELAY_SECONDS:-${DEFAULT_HEALTHCHECK_DELAY_SECONDS}}") \
          DEFAULT_CONTAINER_PORT=$(printf '%q' "${DEFAULT_CONTAINER_PORT}") \
          bash -s
          EOF
          )

          ssh -i "${HOME}/.ssh/id_ed25519" -p "${deploy_port}" "${DEPLOY_USER}@${DEPLOY_HOST}" "${remote_command}" <<'REMOTE'
          set -euo pipefail

          image="${IMAGE_NAME}:${IMAGE_TAG}"
          docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin <<<"${GHCR_READ_TOKEN}"

          run_args=()
          if [[ -n "${CONTAINER_ENV_FILE_PATH:-}" ]]; then
            run_args+=(--env-file "${CONTAINER_ENV_FILE_PATH}")
          fi

          if [[ -n "${DEPLOY_RUN_ARGS:-}" ]]; then
            # shellcheck disable=SC2206
            extra_args=(${DEPLOY_RUN_ARGS})
            run_args+=("${extra_args[@]}")
          fi

          docker pull "${image}"
          docker rm -f "${CONTAINER_NAME}" || true
          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            -e ASPNETCORE_ENVIRONMENT="${ENVIRONMENT_NAME}" \
            -e VERSION="${IMAGE_TAG}" \
            -e COMMIT_NAME="${IMAGE_TAG}" \
            -e DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "${run_args[@]}" \
            "${image}"

          container_health_url="http://$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "${CONTAINER_NAME}"):${DEFAULT_CONTAINER_PORT}/"
          health_ok=0
          for attempt in $(seq 1 "${HEALTHCHECK_RETRIES}"); do
            if response="$(curl --silent --show-error --fail "${container_health_url}")" && grep -q "Healthy" <<<"${response}"; then
              health_ok=1
              printf '%s\n' "${response}"
              break
            fi

            sleep "${HEALTHCHECK_DELAY_SECONDS}"
          done

          if [[ "${health_ok}" -ne 1 ]]; then
            echo "Deployment health check failed for ${CONTAINER_NAME}" >&2
            exit 1
          fi
          REMOTE

      - name: Run smoke tests
        if: inputs.run_smoke_tests
        env:
          CONTAINER_NAME: ${{ inputs.container_name }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT_VALUE: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SMOKE_TEST_URL: ${{ vars.SMOKE_TEST_URL }}
        run: |
          set -euo pipefail

          deploy_port="${DEPLOY_PORT_VALUE:-${DEFAULT_DEPLOY_PORT}}"

          ssh -i "${HOME}/.ssh/id_ed25519" -p "${deploy_port}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "CONTAINER_NAME=$(printf '%q' "${CONTAINER_NAME}") SMOKE_TEST_URL=$(printf '%q' "${SMOKE_TEST_URL}") DEFAULT_CONTAINER_PORT=$(printf '%q' "${DEFAULT_CONTAINER_PORT}") bash -s" <<'REMOTE'
          set -euo pipefail

          smoke_test_url="${SMOKE_TEST_URL:-http://$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "${CONTAINER_NAME}"):${DEFAULT_CONTAINER_PORT}/openapi/v1.json}"
          response="$(curl --silent --show-error --fail "${smoke_test_url}")"
          printf '%s\n' "${response}"

          if [[ -z "${response}" ]]; then
            echo "Smoke test returned an empty response." >&2
            exit 1
          fi
          REMOTE
